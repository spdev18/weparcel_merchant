name: weparcel3
description: "A new Flutter project."
publish_to: 'none'

version: 5.0.0+5

environment:
  sdk: '>=3.0.5 <4.0.0'  # Using the more restrictive version from old project

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.0.12
  nb_utils: ^7.0.3
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.1.0
  flutter_feather_icons: ^2.0.0+1
  material_design_icons_flutter: ^7.0.7296
  country_code_picker: ^3.0.0
  email_validator: ^3.0.0
  flutter_svg: ^2.0.7
  get: ^4.6.5
  get_storage: ^2.0.3

  # UI components
  bottom_bar: ^2.0.1
  syncfusion_flutter_charts: ^26.1.40
  file_picker: ^8.0.6
  carousel_slider: ^5.0.0
  timeline_tile: ^2.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.2.1
  flutter_screenutil: ^5.6.0
  address_search_field: ^5.0.3
  rainbow_color: ^2.0.1

  # Firebase
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  firebase_analytics: ^11.1.0
  google_maps_flutter: ^2.5.0

  uuid: any
  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0  # Keeping the version from old project for compatibility

flutter_icons:
  image_path: "assets/images/logo2.png"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 900